# Strategy parameters. PLAN §4.5. Justify any change in docs/PRIMER.md Part 4.

# Short strike delta band. The plan keeps delta and moves the credit floor (§4.4.2),
# so this is the parameter the whole win-rate thesis rests on.
short_delta_target: 0.16
short_delta_min: 0.15
short_delta_max: 0.20

# Broken-wing (delta-skewed) condor deltas — the TREND structure (§4.4.2, B-1).
# B-1: a single vertical's credit/width equals the risk-neutral breach prob N(-d2),
# which is mathematically pinned BELOW the short strike's |delta| — so at the 0.16
# target above, credit/width tops out near 14-16% and can never reach Gate 9's 18%
# floor. A condor collects TWO credits, so it clears the floor; skewing the short
# deltas gives it the directional lean a trend regime wants without a naked side.
#   near: the trend-favorable short strike, sold CLOSER (more credit, and a short
#         put's +delta / short call's -delta is what tilts the package with-trend).
#   far:  the opposite side, sold FURTHER out — small counter-credit, small offset.
# Est. credit at $1 width: near(0.30)~22% + far(0.10)~9% ~= 31% of one width, well
# clear of 18%. `near` deliberately exceeds short_delta_max: that band governs the
# SYMMETRIC single-vertical thesis; the tilt is the whole point of this structure.
skew_short_delta_near: 0.30
skew_short_delta_far: 0.10

# Days to expiry. 0DTE only after 10:30 and never entered after 14:30 (Gate 11).
min_dte: 0
max_dte: 2

# §4.4.3: width is FIXED at the narrowest tradeable; contract count is the free
# variable. credit/width rises as width narrows, so the narrowest width always
# collects more premium per dollar of defined risk.
# CONFIRMED by measurement 26 Aug 2026: $1 -> 14.5%, $2 -> 11.5%, $5 -> 8.9%.
width_by_underlying:
  SPY: 1
  QQQ: 1
  IWM: 1
  DIA: 1
default_width: 1

# Exit policy (§4.4.1). There is deliberately NO mark-based stop: a 2x credit stop
# is EV-negative at 0-2 DTE and bounded nothing that Gate 2 had not already bounded.
profit_target_pct: 0.50          # resting GTC order, live at the broker (§2.6)
breach_exit_min_minutes_left: 30 # short-strike breach is thesis invalidation
time_stop: "15:40"

# Convexity sleeve (§4.5). Load-bearing at 20-25%, not decoration at 5%.
# This is the only convex payoff in the book, and §4.7 argues convexity is what a
# six-session tournament actually pays for.
convexity_risk_share: 0.22
convexity_min_dte: 2
convexity_max_dte: 7
# Long leg of the debit spread. Nearer the money than the 0.16 we SELL: a debit
# spread only pays if the underlying actually travels, so buying a 0.16-delta long
# is buying a lottery ticket that expires before it prints. 0.35 keeps the
# structure cheap while leaving a realistic path to max profit at 2-7 DTE.
convexity_long_delta_target: 0.35

# The sleeve's DEFAULT structure is a long strangle, not the debit spread above.
# Measured 26 Aug 2026: a directional debit spread carries ~$4,590 of dollar delta
# per contract, so ONE contract consumes 92% of Gate 7's entire $5,000 budget and
# the sleeve deploys $54 of its $440 - six times smaller than the 5% allocation
# PLAN §12 rejected as decoration. A strangle's call and put deltas cancel, so
# Gate 7 stops binding and the sleeve can actually be sized to its budget.
convexity_strangle_delta: 0.16

# Max profit on a strangle is unbounded, so "50% of max profit" is undefined.
# Exit at a multiple of the premium paid instead: 2.0 = close on a 100% gain.
convexity_profit_target_multiple: 2.0

# --- Escalation ladder (§4.7) -----------------------------------------------
# The tournament dial. As sessions run out and the agent falls behind, tilt the
# mix toward convexity (the only convex payoff in the book) and lift core size —
# but ONLY within Gate 2's ceiling, never above it. Deterministic config, fully
# logged, and re-checked by the kernel: the ladder proposes, Gate 2 still disposes.
ladder:
  # The six-session calendar (§4.7). `sessions_left` counts dates on/after today,
  # so it is 6 on Fri 28 Aug, 5 on Mon 31 Aug, ... 1 on the final Fri 4 Sep.
  # Unquoted ISO dates; YAML parses them to date objects and the loader accepts
  # either those or strings.
  session_dates:
    - 2026-08-28
    - 2026-08-31
    - 2026-09-01
    - 2026-09-02
    - 2026-09-03
    - 2026-09-04

  # Day P&L at or above this counts as "ahead" — good enough that protecting the
  # gain (the de-risk rung) beats pressing. A proxy for tournament rank, which the
  # free tier cannot show us. The theta core makes ~0.1%/win, so +2% is a genuinely
  # strong session; below it we are "behind" and the escalation rungs apply.
  day_pnl_target_pct: 0.02

  # The rungs, read FIRST to LAST as a decision table (§4.7). A rung is selected
  # when `sessions_left >= min_sessions_left` AND its `when` matches the standing
  # (any / behind / ahead). Order is the semantics: the ≥4 rung claims the early
  # sessions before any escalation rung, and the trailing `when: any` rung is the
  # mandatory catch-all (an "ahead" back-half session falls through to it).
  #
  # `core_risk_pct` is the REQUEST; Gate 2's `max_risk_per_trade_pct` (0.02) is the
  # cap. The 0.025 rungs are deliberately left as written in §4.7 and clamped in
  # code to 0.02 — the escalation they carry is expressed as convexity share, not
  # as a per-trade loss the kernel would reject. Do not "fix" them upward here; the
  # ceiling lives in risk.yaml and is frozen after Day 4.
  rungs:
    - {min_sessions_left: 4, when: any,    convexity_share: 0.20, core_risk_pct: 0.020}
    - {min_sessions_left: 3, when: behind, convexity_share: 0.30, core_risk_pct: 0.020}
    - {min_sessions_left: 2, when: behind, convexity_share: 0.40, core_risk_pct: 0.025}
    - {min_sessions_left: 1, when: behind, convexity_share: 0.50, core_risk_pct: 0.025}
    - {min_sessions_left: 0, when: any,    convexity_share: 0.15, core_risk_pct: 0.015}

# --- Regime router (§4.3) ---------------------------------------------------
regime:
  # Trend is EMA(fast) vs EMA(slow) on daily closes, expressed as a fraction of
  # the slow EMA so it is comparable across underlyings at different price levels.
  ema_fast: 9
  ema_slow: 21
  # Below this separation the tape is not trending — it is chopping, and a
  # direction-agnostic condor is the right structure.
  trend_threshold: 0.0015

  # VRP is a rolling PERCENTILE, never `IV - RV > 0` (§4.3.1). The sign test is
  # true nearly every day, which would make STRESS unreachable and collapse the
  # router to "always sell".
  vrp_sell_floor_pct: 0.40      # below this, do not sell premium
  vrp_stress_pct: 0.10          # bottom decile: vol is cheap relative to recent pricing

  # Option 1 — the cold-start VRP override (§4.3.1). With no historical IV the
  # VRP percentile comes from the realized-vol proxy, which can bench us even when
  # implied vol is demonstrably rich over realized. When we are on that proxy path
  # AND the *real* vrp_raw (annualized IV − annualized RV) clears this absolute
  # floor, override the sell-floor STAND-DOWN and trade at reduced size instead.
  # A measurement beats a proxy assumption; the caution is kept as size, not a veto.
  # Only ever loosens the cold-start path — a real percentile is trusted untouched,
  # and the STRESS decile and gap vetoes are never overridden.
  vrp_raw_rich_abs: 0.03        # IV must exceed RV by >= 3 annualized vol points
  vrp_override_size: 0.5        # size when trading on the override, not a full stand-down

  # An overnight gap this large means the model's assumptions were made in a
  # different market than the one that opened.
  stress_gap_pct: 0.012

  # CHEAP-VOL funds the convexity sleeve: buy movement when it is on sale.
  cheap_vol_iv_pct: 0.33

  # Option 3 — bootstrap the IV percentile the CHEAP_VOL regime needs (§4.3.1).
  # The free tier serves no historical IV, so the series accumulates forward from
  # `market_snapshots` and is padded with a synthetic band (anchored to the first
  # measured IV, shaped by the realized-vol distribution) up to this many points.
  # Below this, iv_pct stays unranked and CHEAP_VOL stays offline — a percentile
  # over too few points is noise, and firing the convexity sleeve on noise bleeds
  # theta. See signals/iv_seed.py.
  iv_seed_min_sessions: 20

# --- Local greeks (§1.3, the A1 fallback) -----------------------------------
# A1 was MEASURED on 28 Aug 2026 and failed: the free indicative feed omits
# `greeks` and `implied_volatility` from the payload entirely — they are OPRA-only,
# and OPRA needs a paid Algo Trader Plus subscription. Delta and IV are therefore
# modelled locally from the quote. See src/vigil/data/greeks.py.
greeks:
  # Annualised risk-free rate for the Black-Scholes discount factor, roughly the
  # 3-month T-bill. At 0-2 DTE the discount term is ~0.9999, so delta is almost
  # completely insensitive to this — it is configured so the number is stated
  # somewhere rather than buried in a module, not because it needs tuning.
  risk_free_rate: 0.04
