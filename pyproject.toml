[project]
name = "vigil"
version = "0.1.0"
description = "Autonomous defined-risk options trading agent (Alpaca paper)"
readme = "README.md"
# Pinned to 3.12 per CLAUDE.md. uv will download this interpreter itself if the
# system Python differs — that is why we can pin narrowly without breaking anyone.
requires-python = ">=3.12,<3.13"

dependencies = [
    # The hot path into Alpaca: trading, market data, and options chain snapshots.
    "alpaca-py>=0.33",
    # LLM portfolio manager (Responses API): strict structured outputs give the
    # risk kernel a schema-enforced input contract at the API boundary.
    "openai>=3.3.1",
    # Reads .env into os.environ. Keys never live in source (hard rule #2).
    "python-dotenv>=1.0",
    # config/*.yaml is the only place thresholds live; no magic numbers in code.
    "pyyaml>=6.0.3",
    # The journal is genuinely relational (PLAN §3) and gate_verdicts is the most
    # valuable table in the repo. 2.0 async style throughout.
    "sqlalchemy[asyncio]>=2.0",
    # The async Postgres driver SQLAlchemy's asyncio engine needs.
    "asyncpg>=0.29",
    # Schema changes go through migrations, never create_all() (CLAUDE.md).
    "alembic>=1.13",
    # JSON-line logs where every line carries session_id and cycle_id: `bind()`
    # attaches cycle context once instead of threading a dict through every call.
    "structlog>=24.1",
    # The read/control API (PLAN §7). The submission requires a working URL, and
    # FastAPI gives SSE via StreamingResponse without a second framework.
    "fastapi>=0.115",
    # The ASGI server FastAPI needs to actually serve; `[standard]` brings the
    # uvloop/httptools speedups and the websocket support SSE clients negotiate.
    "uvicorn[standard]>=0.30",
    # Optional chain-snapshot cache under the 200 req/min ceiling (PLAN §1.2). Never
    # the record — the worker trades with Redis stopped (hard rule #6), so this is a
    # pure passthrough optimization that falls through to a live fetch on any miss.
    "redis>=5.0",
]

[dependency-groups]
# uv's native dev-dependency mechanism (PEP 735). Not installed in the runtime image.
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    # Gate 2's property test: no approved proposal ever exceeds 2% of equity,
    # proven across generated inputs rather than three hand-picked examples.
    # A test-only dependency, so it does not belong in the runtime image.
    "hypothesis>=6.165.10",
    # The journal tests run against a real Postgres, because the guarantees they
    # check are database guarantees: a UNIQUE constraint and a NUMERIC type
    # cannot be verified against a mock of themselves.
    "pytest-asyncio>=0.24",
    # FastAPI's TestClient is httpx under the hood; ASGITransport lets the API
    # tests exercise real routing and dependency injection in-process, with no
    # port bound and no server to race.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ layout: the importable package is src/vigil, exposed as `vigil`.
packages = ["src/vigil"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
# Migration bodies are generated by `alembic revision --autogenerate`; reformatting
# them on every run would produce diff noise that hides the one hand-written line
# that actually matters. env.py IS hand-edited, so it stays linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# api/page.py is one HTML document held in a Python string. Its long lines are
# CSS selectors and JS expressions, where the 100-column rule buys nothing and
# wrapping would make the markup harder to read, not easier.
"src/vigil/api/page.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids function calls in argument defaults, because the call runs once at
# import and every request then shares the result. FastAPI's `Depends`, `Query`
# and `Body` are built to be evaluated exactly that way — the object is a marker
# the framework reads, never mutable per-request state — so the rule is a false
# positive on the framework's core idiom rather than a smell worth working around.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body",
                          "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
# Third-party stubs are incomplete for alpaca-py; don't fail the build on their types.
ignore_missing_imports = true

[tool.pytest.ini_options]
# src layout without relying on the editable install. On macOS, uv marks .venv
# hidden and CPython silently ignores hidden .pth files, so the editable install
# can vanish at any time; putting src on the path here makes tests deterministic.
# "." as well so tests can import shared helpers from tests.conftest.
pythonpath = ["src", "."]
testpaths = ["tests"]
# Integration tests that need Postgres are marked and skipped when it is absent,
# so `pytest` stays green on a machine with no database.
markers = ["db: requires a live Postgres (set DATABASE_URL or run locally)"]
asyncio_mode = "auto"
